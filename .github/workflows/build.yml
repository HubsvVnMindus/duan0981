name: Build APK with Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses-dev \
          cmake \
          libffi-dev \
          libssl-dev \
          python3-dev
        # Giới hạn phiên bản Cython < 3.0.0 để tránh lỗi tương thích Buildozer
        pip install --upgrade buildozer "cython<3.0.0" virtualenv

    - name: Build APK
      run: |
        # Dùng 'yes' để tự động nhấn Y chấp nhận các điều khoản SDK/NDK
        # Thêm tham số -v để hiển thị log chi tiết
        yes | buildozer -v android debug

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: bin/*.apk
